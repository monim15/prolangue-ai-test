<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ProLangue AI Test</title>
<style>
:root { --bg:#f5f5f9; --card:#fff; --chip:#f1f0f6; --line:#e3e3ea; --fg:#1a1b1f; --muted:#555b6b; --primary:#0058bc; --on:#fff; --err:#ba1a1a; --err-bg:#ffe7e4; --ok-bg:#e3ecfb; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1116; --card:#1a1c23; --chip:#23262f; --line:#2c2f38; --fg:#eceef4; --muted:#b9bfcd; --primary:#8db4ff; --on:#0a1a38; --err:#ffb4ab; --err-bg:#3a1c1a; --ok-bg:#1d2a45; } }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.app { max-width: 520px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; }
h1 { margin:0; font-size:24px; letter-spacing:-.01em; }
.sub { margin:2px 0 0; color:var(--muted); font-size:14px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px; }
label { font-size:13px; font-weight:600; color:var(--muted); }
textarea { width:100%; min-height:96px; resize:vertical; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--chip); color:var(--fg); font:inherit; }
textarea:focus, button:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
.count { align-self:flex-end; font-size:12px; color:var(--muted); margin-top:-6px; }
.langs { display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
.lang { padding:10px 4px; border-radius:12px; border:1px solid var(--line); background:var(--chip); color:var(--fg); font:inherit; font-size:14px; }
.lang[aria-pressed=true] { background:var(--primary); color:var(--on); border-color:var(--primary); font-weight:600; }
.row { display:flex; gap:10px; }
.btn { flex:1; padding:14px; border-radius:12px; border:0; font:inherit; font-weight:600; }
.btn.primary { background:var(--primary); color:var(--on); flex:2; }
.btn.soft { background:var(--chip); color:var(--primary); }
.btn:disabled { opacity:.55; }
.load { display:flex; align-items:center; gap:12px; color:var(--muted); }
.spin { width:22px; height:22px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--primary); animation:s .8s linear infinite; }
@keyframes s { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }
.err { background:var(--err-bg); border-radius:12px; padding:12px 14px; color:var(--fg); }
.err b { color:var(--err); }
.out { font-size:26px; font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { padding:4px 10px; border-radius:999px; background:var(--chip); font-size:13px; color:var(--muted); }
.tag.src { background:var(--ok-bg); color:var(--primary); font-weight:600; }
.ex { border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:2px; }
.ex .t { color:var(--muted); }
.note { color:var(--muted); font-size:14px; }
input[type=password], input[type=text] { width:100%; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--chip); color:var(--fg); font:inherit; }
details.card summary { font-weight:600; cursor:pointer; }
.hint { font-size:13px; color:var(--muted); margin:0; }
.keystate { font-size:13px; font-weight:600; }
[hidden] { display:none !important; }
</style>
</head>
<body>
<main class="app">
  <header><h1>ProLangue AI Test</h1><p class="sub">Real Gemini translation, English → your language</p></header>

  <section class="card">
    <label for="text">English word or sentence</label>
    <textarea id="text" maxlength="200" placeholder="e.g. accomplish, or: Where is the train station?" autocomplete="off" autocapitalize="sentences"></textarea>
    <span class="count" id="count">0 / 200</span>
    <label id="langlabel">Translate into</label>
    <div class="langs" role="group" aria-labelledby="langlabel" id="langs"></div>
    <div class="row">
      <button class="btn soft" id="clear" type="button">Clear</button>
      <button class="btn primary" id="go" type="button">Translate</button>
    </div>
  </section>

  <details class="card" id="settings">
    <summary>Settings: Gemini API key <span class="keystate" id="keystate"></span></summary>
    <p class="hint">Private test build only. The key is typed here, stored only on this phone, and is not part of the app file or any repository. Use a dedicated key you can delete after testing.</p>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your Gemini API key">
    <div class="row"><button class="btn soft" id="keyclear" type="button">Remove key</button><button class="btn primary" id="keysave" type="button">Save key</button></div>
  </details>

  <section class="card load" id="loading" role="status" aria-live="polite" hidden><span class="spin"></span><span id="loadmsg">Translating…</span></section>
  <section class="err" id="error" role="alert" hidden></section>

  <section class="card" id="result" aria-live="polite" hidden>
    <div class="tags" id="tags"></div>
    <div class="out" id="out"></div>
    <div class="note" id="note"></div>
    <div id="examples"></div>
  </section>
</main>

<script src="translate.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LABEL = { ar: "العربية", fr: "Français", es: "Español", tr: "Türkçe" };
  var NAMES = PLTranslate.LANGS;
  var lang = "ar", busy = false, apiKey = "";
  function store() { try { return window.localStorage; } catch (e) { return null; } }
  var st = store();
  try { lang = st.getItem("pl-lang") || "ar"; apiKey = st.getItem("pl-gemini-key") || ""; } catch (e) {}
  if (!NAMES[lang]) lang = "ar";
  var tr = PLTranslate.createTranslator({ storage: st });

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function langButtons() { $("langs").innerHTML = Object.keys(LABEL).map(function (k) { return '<button class="lang" type="button" data-l="' + k + '" aria-pressed="' + (k === lang) + '">' + LABEL[k] + "</button>"; }).join(""); }
  function keyState() { $("keystate").textContent = apiKey ? "· saved ✓" : "· not set"; $("settings").open = !apiKey; }
  function showError(t, m) { $("error").innerHTML = "<b>" + esc(t) + "</b><br>" + esc(m); $("error").hidden = false; }
  function hideError() { $("error").hidden = true; }
  function hideResult() { $("result").hidden = true; }
  function setBusy(b) { busy = b; $("go").disabled = b; $("loading").hidden = !b; }

  $("langs").addEventListener("click", function (e) { var b = e.target.closest("[data-l]"); if (!b) return; lang = b.dataset.l; try { st.setItem("pl-lang", lang); } catch (x) {} langButtons(); hideResult(); });
  $("text").addEventListener("input", function () { $("count").textContent = $("text").value.length + " / 200"; });
  $("clear").addEventListener("click", function () { $("text").value = ""; $("count").textContent = "0 / 200"; hideError(); hideResult(); $("text").focus(); });
  $("text").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } });
  $("go").addEventListener("click", go);
  $("keysave").addEventListener("click", function () {
    var v = $("key").value.trim(); if (!v) { showError("No key entered", "Paste your Gemini API key first."); return; }
    apiKey = v; try { st.setItem("pl-gemini-key", v); } catch (e) {} $("key").value = ""; hideError(); keyState();
  });
  $("keyclear").addEventListener("click", function () { apiKey = ""; try { st.removeItem("pl-gemini-key"); } catch (e) {} keyState(); });

  var TITLES = { input: "Check your text", nokey: "API key needed", network: "No connection", key: "API key problem", model: "Model unavailable", rate: "Rate limit", busy: "Gemini busy", blocked: "Blocked", unavailable: "Try again", rejected: "Request rejected" };
  async function go() {
    if (busy) return; hideError(); hideResult();
    if (!navigator.onLine) { showError("You're offline", "Connect to the internet and try again."); return; }
    setBusy(true);
    try { var r = await tr.translate($("text").value, lang, apiKey); render(r); }
    catch (err) { showError(TITLES[err.code] || "Something went wrong", err.message || "Please try again."); }
    finally { setBusy(false); }
  }
  function render(r) {
    var d = r.data, rtl = lang === "ar";
    $("tags").innerHTML = ['<span class="tag src">' + (r.source === "cache" ? "From saved cache (no Gemini call)" : "Fresh from Gemini") + "</span>", '<span class="tag">' + esc(d.kind) + "</span>",
      d.partOfSpeech ? '<span class="tag">' + esc(d.partOfSpeech) + "</span>" : "", d.ipa ? '<span class="tag">' + esc(d.ipa) + "</span>" : "", '<span class="tag">' + NAMES[lang] + "</span>"].join("");
    $("out").textContent = d.translation; $("out").dir = rtl ? "rtl" : "ltr"; $("out").lang = lang;
    $("note").textContent = d.note || "";
    $("examples").innerHTML = (d.examples || []).map(function (x) { return '<div class="ex"><div>' + esc(x.en) + '</div><div class="t" dir="' + (rtl ? "rtl" : "ltr") + '" lang="' + lang + '">' + esc(x.translation) + "</div></div>"; }).join("");
    $("result").hidden = false;
  }
  langButtons(); keyState();
})();
</script>
</body>
</html>
